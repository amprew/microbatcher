[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microbatcher"
version = "0.1.0"
description = "Tiny, dependency-free micro-batching for asyncio and threads: per-item results, partial failure, backpressure, retries, ordered keys, graceful drain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["batching", "asyncio", "backpressure", "dataloader", "bulk", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/microbatcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
